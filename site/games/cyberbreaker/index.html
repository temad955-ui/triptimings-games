<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#07041a" />
  <meta name="description" content="CyberBreaker: a neon brick breaker with stage map, shape modes and tactical laser cards." />
  <title>CyberBreaker · Trip Timings Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Cairo:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../shared/ads.css" />
  <style>#app .ad-slot--banner{max-width:320px;height:50px;flex:none;margin-top:10px}</style>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Reusable SVG icon symbols -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M10.3 2.8h3.4l.5 2.6 1.9.8 2.2-1.5 2.4 2.4-1.5 2.2.8 1.9 2.6.5v3.4l-2.6.5-.8 1.9 1.5 2.2-2.4 2.4-2.2-1.5-1.9.8-.5 2.6h-3.4l-.5-2.6-1.9-.8-2.2 1.5-2.4-2.4 1.5-2.2-.8-1.9-2.6-.5v-3.4l2.6-.5.8-1.9-1.5-2.2 2.4-2.4 2.2 1.5 1.9-.8Z"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></symbol>
      <symbol id="i-gem" viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9z" fill="currentColor" opacity=".35"/><path d="M6 3h12l4 6-10 12L2 9zM2 9h20M9 3l-2 6 5 12 5-12-2-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
      <symbol id="i-row" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/></symbol>
      <symbol id="i-col" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M12 3v18M8 7l4-4 4 4M8 17l4 4 4-4"/></symbol>
      <symbol id="i-cross" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M12 2v20M2 12h20"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
      <symbol id="i-speed" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M4 6l7 6-7 6M12 6l7 6-7 6"/></symbol>
      <symbol id="i-recall" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M12 3v12M7 10l5 5 5-5M4 20h16"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2" fill="currentColor"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.2"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z" fill="currentColor"/></symbol>
      <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.3 9.2a2.8 2.8 0 1 1 3.9 2.6c-.8.4-1.2 1-1.2 1.9v.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.3" r="1.2" fill="currentColor"/></symbol>
      <symbol id="i-gift" viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><rect x="5" y="13" width="14" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 9v12M12 9c-2-4-6-4-6-1.5S10 9 12 9c2 0 6-0 6-1.5S14 5 12 9" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
      <symbol id="i-sq" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2.4"/></symbol>
      <symbol id="i-tri" viewBox="0 0 24 24"><path d="M4 20V4l16 16z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></symbol>
      <symbol id="i-hex" viewBox="0 0 24 24"><path d="M12 2.5l8.2 4.75v9.5L12 21.5l-8.2-4.75v-9.5z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></symbol>
      <symbol id="i-chaos" viewBox="0 0 24 24"><path d="M12 2l2.2 6.3L21 9l-5.2 4.2L17.6 21 12 17.2 6.4 21l1.8-7.8L3 9l6.8-.7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-mix" viewBox="0 0 24 24"><rect x="2.5" y="2.5" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M14 10.5V2.5l8 8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 13l4.3 2.5v5L12 23l-4.3-2.5v-5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    </defs>
  </svg>

  <div id="app">
    <!-- ================= MENU ================= -->
    <section id="menuScreen" class="screen active" aria-label="Main menu">
      <div class="menu-top">
        <!-- Trip Timings Games Hub: back to lobby -->
        <a class="icon-btn" href="../../" aria-label="All games" title="All games"><svg><use href="#i-back"/></svg></a>
        <div class="pill gem-pill"><svg><use href="#i-gem"/></svg><span class="js-gems">0</span></div>
        <button class="icon-btn" data-action="help" aria-label="How to play"><svg><use href="#i-help"/></svg></button>
        <button class="icon-btn" data-action="settings" aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
      </div>

      <div class="logo" aria-label="CyberBreaker">
        <div class="logo-shapes"><svg class="c-cyan"><use href="#i-sq"/></svg><svg class="c-pink"><use href="#i-tri"/></svg><svg class="c-gold"><use href="#i-hex"/></svg></div>
        <h1><span class="l1">CYBER</span><span class="l2">BREAKER</span></h1>
        <p class="tagline" data-i18n="tagline">// NEON GRID PROTOCOL</p>
      </div>

      <div class="mode-picker" role="radiogroup" aria-label="Shape mode">
        <button class="mode-chip" data-mode="classic" role="radio"><svg><use href="#i-sq"/></svg><b data-i18n="m_classic">Classic</b><small data-i18n="s_classic">Squares</small></button>
        <button class="mode-chip" data-mode="polygon" role="radio"><svg><use href="#i-hex"/></svg><b data-i18n="m_polygon">Polygon</b><small data-i18n="s_polygon">Tri · Hex · Gem</small></button>
        <button class="mode-chip" data-mode="mixed" role="radio"><svg><use href="#i-mix"/></svg><b data-i18n="m_mixed">Mixed</b><small data-i18n="s_mixed">All shapes</small></button>
        <button class="mode-chip" data-mode="chaos" role="radio"><svg><use href="#i-chaos"/></svg><b data-i18n="m_chaos">Chaos</b><small data-i18n="s_chaos">All threats</small></button>
      </div>

      <div class="menu-actions">
        <button class="neon-btn primary" data-action="map" data-i18n="stageMap">Stage Map</button>
        <button class="neon-btn" data-action="endless" data-i18n="endless">Endless Run</button>
        <button class="neon-btn ghost" id="giftBtn" data-action="gift"><svg><use href="#i-gift"/></svg><span id="giftLabel">Daily Cache</span></button>
      </div>
      <p class="menu-foot" id="menuBest"></p>
      <div class="ad-slot" data-slot="start" data-size="banner" data-when="#menuScreen.active"></div>
    </section>

    <!-- ================= STAGE MAP ================= -->
    <section id="mapScreen" class="screen" aria-label="Stage map">
      <header class="bar">
        <button class="icon-btn" data-action="menu" aria-label="Back"><svg><use href="#i-back"/></svg></button>
        <h2 data-i18n="mapTitle">STAGE MAP</h2>
        <div class="pill gem-pill"><svg><use href="#i-gem"/></svg><span class="js-gems">0</span></div>
      </header>
      <div class="map-tabs" role="tablist">
        <button class="tab" data-mode="classic"><svg><use href="#i-sq"/></svg><span data-i18n="m_classic">Classic</span></button>
        <button class="tab" data-mode="polygon"><svg><use href="#i-hex"/></svg><span data-i18n="m_polygon">Polygon</span></button>
        <button class="tab" data-mode="mixed"><svg><use href="#i-mix"/></svg><span data-i18n="m_mixed">Mixed</span></button>
        <button class="tab" data-mode="chaos"><svg><use href="#i-chaos"/></svg><span data-i18n="m_chaos">Chaos</span></button>
      </div>
      <div class="map-summary"><span id="mapStars"></span><span id="mapUnlocked"></span></div>
      <div class="map-scroll"><div id="stageGrid" class="stage-grid"></div></div>
    </section>

    <!-- ================= GAME ================= -->
    <section id="gameScreen" class="screen" aria-label="Game">
      <header class="hud">
        <div class="hud-row">
          <button class="icon-btn" data-action="pause" aria-label="Pause"><svg><use href="#i-pause"/></svg></button>
          <div class="hud-stage" id="hudStage">STAGE 1</div>
          <div class="pill gem-pill small"><svg><use href="#i-gem"/></svg><span class="js-gems">0</span></div>
          <button class="icon-btn" data-action="settings" aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
        </div>
        <div class="hud-row stats">
          <div class="stat"><small data-i18n="score">SCORE</small><b id="hudScore">0</b></div>
          <div class="progress"><div class="progress-fill" id="hudFill"></div><span id="hudLine">LINE 0</span></div>
          <div class="stat right"><small data-i18n="best">BEST</small><b id="hudBest">0</b></div>
        </div>
      </header>

      <div id="boardWrap">
        <canvas id="board"></canvas>
        <div id="hint" class="hint" hidden></div>
        <div id="toast" class="toast"></div>
      </div>

      <footer class="controls">
        <div class="launch-row">
          <label class="sr" for="aimSlider">Aim angle</label>
          <input type="range" id="aimSlider" min="-80" max="80" step="0.5" value="0" />
          <button class="fire-btn" id="fireBtn" data-i18n="fire">FIRE</button>
        </div>
        <div class="card-row">
          <button class="card c-pink" data-card="h" aria-label="Row laser card"><svg><use href="#i-row"/></svg><span class="cnt" id="cnt-h">0</span></button>
          <button class="card c-cyan" data-card="v" aria-label="Column laser card"><svg><use href="#i-col"/></svg><span class="cnt" id="cnt-v">0</span></button>
          <button class="card c-gold" data-card="x" aria-label="Cross blast card"><svg><use href="#i-cross"/></svg><span class="cnt" id="cnt-x">0</span></button>
          <span class="divider"></span>
          <button class="mini-btn" id="speedBtn" aria-label="Ball speed"><svg><use href="#i-speed"/></svg><span id="speedLabel">1×</span></button>
          <button class="mini-btn" id="recallBtn" aria-label="Recall balls"><svg><use href="#i-recall"/></svg></button>
          <button class="bonus-btn" id="bonusBtn" aria-label="Bonus balls"><span id="bonusLabel">+10</span><small data-i18n="bonus">BONUS</small></button>
        </div>
      </footer>
    </section>

    <!-- ================= MODALS ================= -->
    <div class="modal" id="pauseModal" hidden>
      <div class="panel">
        <h3 data-i18n="paused">PAUSED</h3>
        <button class="neon-btn primary" data-action="resume" data-i18n="resume">Resume</button>
        <button class="neon-btn" data-action="restart" data-i18n="restart">Restart</button>
        <button class="neon-btn" data-action="settings" data-i18n="settings">Settings</button>
        <button class="neon-btn ghost" data-action="quit" data-i18n="quit">Quit</button>
      </div>
    </div>

    <div class="modal" id="settingsModal" hidden>
      <div class="panel">
        <h3 data-i18n="settingsTitle">SETTINGS</h3>
        <label class="switch lang-row" for="langSelect"><span data-i18n="language">Language</span>
          <select id="langSelect"><option value="auto">Phone language</option><option value="en">English</option><option value="ar">العربية</option></select></label>
        <label class="switch"><span data-i18n="sound">Sound effects</span><input type="checkbox" data-setting="sound"><i></i></label>
        <label class="switch"><span data-i18n="haptics">Vibration</span><input type="checkbox" data-setting="haptics"><i></i></label>
        <label class="switch"><span data-i18n="fxHigh">High glow effects</span><input type="checkbox" data-setting="fxHigh"><i></i></label>
        <label class="switch"><span data-i18n="guide">Long aim guide</span><input type="checkbox" data-setting="guide"><i></i></label>
        <button class="neon-btn danger" id="resetBtn" data-i18n="reset">Reset progress</button>
        <button class="neon-btn primary" data-action="closeSettings" data-i18n="done">Done</button>
      </div>
    </div>

    <div class="modal" id="overModal" hidden>
      <div class="panel">
        <h3 class="c-pink-t" data-i18n="overTitle">SYSTEM BREACH</h3>
        <p class="sub" id="overSub">The grid reached your launcher.</p>
        <div class="summary">
          <div><small data-i18n="score">SCORE</small><b id="overScore">0</b></div>
          <div><small data-i18n="best">BEST</small><b id="overBest">0</b></div>
          <div><small data-i18n="lines">LINES</small><b id="overLines">0</b></div>
        </div>
        <button class="neon-btn gold" id="reviveBtn"><span data-i18n="revive">Revive</span> · <svg><use href="#i-gem"/></svg><span id="reviveCost">60</span></button>
        <button class="neon-btn primary" data-action="restart" data-i18n="retry">Retry</button>
        <button class="neon-btn ghost" data-action="quit" data-i18n="exit">Exit</button>
        <div class="ad-slot" data-slot="gameover"></div>
      </div>
    </div>

    <div class="modal" id="clearModal" hidden>
      <div class="panel">
        <h3 class="c-cyan-t" data-i18n="clearTitle">STAGE CLEARED</h3>
        <div class="big-stars" id="clearStars"><svg><use href="#i-star"/></svg><svg><use href="#i-star"/></svg><svg><use href="#i-star"/></svg></div>
        <div class="summary">
          <div><small data-i18n="score">SCORE</small><b id="clearScore">0</b></div>
          <div><small data-i18n="reward">REWARD</small><b><span id="clearGems">0</span> <svg class="inline-gem"><use href="#i-gem"/></svg></b></div>
        </div>
        <button class="neon-btn primary" id="nextBtn" data-i18n="next">Next Stage</button>
        <button class="neon-btn" data-action="restart" data-i18n="replay">Replay</button>
        <button class="neon-btn ghost" data-action="map" data-i18n="stageMap">Stage Map</button>
      </div>
    </div>

    <div class="modal" id="bonusModal" hidden>
      <div class="panel">
        <h3 class="c-gold-t" data-i18n="bonusTitle">BONUS BOOST</h3>
        <p class="sub" data-i18n="bonusSub">Simulated reward break (no real ads).</p>
        <div class="countdown" id="bonusCount">3</div>
        <p class="sub" id="bonusText"></p>
      </div>
    </div>

    <div class="modal" id="helpModal" hidden>
      <div class="panel help">
        <h3 data-i18n="helpTitle">HOW TO PLAY</h3>
        <ul id="helpList"></ul>
        <button class="neon-btn primary" data-action="closeHelp" data-i18n="gotIt">Got it</button>
      </div>
    </div>
  </div>

  <!-- Trip Timings Games Hub: shared runtime + cross-promotion.
       The offer card is triggered by watching #overModal, so game.js stays untouched.
       The ribbon is off here because CyberBreaker's controls sit at the bottom.
       Ad slots: settings in /shared/ads-config.js; no ads while #gameScreen is active. -->
  <script src="../../shared/hub.js"></script>
  <script src="../../shared/economy.js"></script>
  <script src="../../shared/promo.js" data-game="cyberbreaker" data-watch="#overModal" data-ribbon="0"></script>
  <script src="../../shared/ads-config.js"></script>
  <script src="../../shared/ads.js" data-playing="#gameScreen.active" data-menus="#overModal:not([hidden]), #clearModal:not([hidden])"></script>
  <script src="game.js"></script>
</body>
</html>
