<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#07041a" />
  <title>Nile Treasures Match · Trip Timings Games</title>
  <meta name="description" content="Nile Treasures: swap the jewels, match three or more and clear the level goals. Free match-3 puzzle on Trip Timings Games." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../shared/hub.css" />
  <link rel="stylesheet" href="../../shared/promo.css" />
  <link rel="stylesheet" href="../../shared/ads.css" />
  <link rel="stylesheet" href="../../shared/economy.css" />
  <link rel="stylesheet" href="../../shared/arcade.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-shell">
    <header class="game-bar">
      <h1 class="game-title" data-t="title">كنوز النيل</h1>
      <div class="stats"><div class="stat"><small data-t="moves">الحركات</small><b id="moves">0</b></div>
        <div class="stat"><small data-t="level">المستوى</small><b id="level">1</b></div>
        <div class="stat"><small data-t="best">أعلى مستوى</small><b id="best">0</b></div>
      </div>
    </header>
    <div class="board-wrap" id="wrap">
      <canvas id="board" aria-label="Game board"></canvas>
      <div class="toast" id="toast"></div>
    </div>
    <div class="tools" id="tools"><button class="tool" id="hammerBtn" type="button">🔨 <b></b></button><button class="tool" id="shuffleBtn" type="button">🔀 <b></b></button></div>
    <p class="hint" data-t="hint"></p>
  </main>

  <div class="overlay" id="startPanel">
    <div class="panel">
      <h2 data-t="title">كنوز النيل</h2>
      <p data-t="howto"></p>
      <div class="map" id="map" aria-label="Level map"></div>
      <button class="btn" id="startBtn" type="button">ابدأ</button>
      <div class="ad-slot" data-slot="start"></div>
    </div>
  </div>

  <div class="overlay" id="winPanel" hidden>
    <div class="panel">
      <h2 id="winTitle"></h2>
      <p class="new-best" id="winStars"></p>
      <button class="btn" id="nextBtn" type="button"></button>
      <button class="btn ghost" id="winShare" type="button" data-t="share"></button>
      <div class="ad-slot" data-slot="gameover"></div>
    </div>
  </div>

  <div class="overlay" id="failPanel" hidden>
    <div class="panel">
      <h2 id="failText"></h2>
      <button class="btn nile" id="reviveBtn" type="button" hidden></button>
      <button class="btn" id="retryBtn" type="button" data-t="retry"></button>
    </div>
  </div>

  <div class="ad-slot" data-slot="banner-bottom" data-fixed="1"></div>

  <script src="../../shared/hub.js"></script>
  <script src="../../shared/economy.js"></script>
  <script src="../../shared/promo.js" data-game="nile-match" data-home="1" data-ribbon="0"></script>
  <script src="../../shared/ads-config.js"></script>
  <script src="../../shared/ads.js" data-playing="body.playing" data-menus="#startPanel:not([hidden]), #winPanel:not([hidden]), #failPanel:not([hidden])"></script>
  <script src="../../shared/levels.js"></script>
  <script src="game.js"></script>
</body>
</html>
