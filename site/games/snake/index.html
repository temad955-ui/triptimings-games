<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b1026" />
  <title>Neon Snake · Trip Timings Games</title>
  <meta name="description" content="Neon Snake: a modern take on the classic snake game. Free on Trip Timings Games." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../shared/hub.css" />
  <link rel="stylesheet" href="../../shared/promo.css" />
  <link rel="stylesheet" href="../../shared/ads.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-shell">
    <header class="game-bar">
      <h1 class="game-title" data-t="title">الثعبان النيون</h1>
      <div class="stats">
        <div class="stat"><small data-t="score">النقاط</small><b id="score">0</b></div>
        <div class="stat"><small data-t="best">الأفضل</small><b id="best">0</b></div>
      </div>
    </header>

    <div class="mode-row" role="radiogroup">
      <button class="chip" data-mode="classic" role="radio" data-t="classic">كلاسيك</button>
      <button class="chip" data-mode="portal" role="radio" data-t="portal">بوابات</button>
      <button class="chip" data-mode="maze" role="radio" data-t="maze">متاهة</button>
    </div>

    <div class="board-wrap">
      <canvas id="board" aria-label="Snake board"></canvas>
      <div class="toast" id="toast"></div>
    </div>

    <div class="dpad" aria-label="Controls">
      <button data-dir="up" aria-label="Up">▲</button>
      <button data-dir="left" aria-label="Left">◀</button>
      <button data-dir="pause" aria-label="Pause" class="mid">❚❚</button>
      <button data-dir="right" aria-label="Right">▶</button>
      <button data-dir="down" aria-label="Down">▼</button>
    </div>
  </main>

  <div class="overlay" id="startPanel">
    <div class="panel">
      <h2 data-t="title">الثعبان النيون</h2>
      <p data-t="howto">اسحب على الشاشة أو استخدم الأسهم. كُل الفاكهة لتكبر، والتفاحة الذهبية تعطي نقاطًا مضاعفة قبل أن تختفي!</p>
      <button class="btn" id="startBtn" data-t="play">ابدأ اللعب</button>
      <div class="ad-slot" data-slot="start"></div>
    </div>
  </div>

  <div class="overlay" id="overPanel" hidden>
    <div class="panel">
      <h2 data-t="over">انتهت الجولة</h2>
      <div class="big-score" id="overScore">0</div>
      <p id="overBest"></p>
      <button class="btn" id="againBtn" data-t="again">العب مرة أخرى</button>
      <div class="ad-slot" id="overPromo" data-slot="gameover"></div>
    </div>
  </div>

  <div class="ad-slot" data-slot="banner-bottom" data-fixed="1"></div>

  <script src="../../shared/hub.js"></script>
  <script src="../../shared/promo.js" data-game="snake" data-home="1" data-ribbon="0"></script>
  <!-- Ad slots: settings in /shared/ads-config.js (AdSense or any network; cross-promo by default) -->
  <script src="../../shared/ads-config.js"></script>
  <script src="../../shared/ads.js" data-playing="body" data-menus="#startPanel:not([hidden]), #overPanel:not([hidden])"></script>
  <script src="game.js"></script>
</body>
</html>
