# Checks that the Docker image builds and serves every page (used by Coolify).
name: Docker build check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dominoes rules test
        run: node tests/dominoes-engine.test.js && node tests/chess-engine.test.js
      - name: Build image
        run: docker build -t triptimings-games .
      - name: Run and check pages
        run: |
          docker run -d --name ttg -p 8080:8080 triptimings-games
          for i in $(seq 1 20); do curl -fs http://localhost:8080/healthz && break; sleep 1; done
          for u in / /privacy.html /ads.txt /shared/ads.js /shared/ads-config.js \
                   /games/cyberbreaker/ /games/bubble-shooter/ /games/dominoes/ /games/domino31/ /games/nile-blocks/ /games/neon-stack/ /games/desert-rush/ /games/pharaoh-memory/ \
                   /games/sand-sort/ /games/parking-jam/ /games/arrow-escape/ /games/nile-match/ /games/chess/ /shared/levels.js \
                   /games/tourism-quiz/ /games/spin-wheel/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$u")
            echo "$code $u"; [ "$code" = 200 ] || exit 1
          done
