# Trip Timings Games Hub — Nginx server block
# Runs as non-root on port 8080 (nginx-unprivileged image). Coolify/Traefik
# terminates TLS in front of it, so this listens on plain HTTP only.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;   # keep redirects relative behind the Coolify proxy

    # ---- compression ----
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- security headers (repeated in every location that adds headers) ----
    # Paid ad networks (AdSense, its consent message, or any network pasted in
    # site/shared/ads-config.js) load scripts, iframes and pixels from many
    # rotating hosts, so scripts/frames/images/requests are allowed over HTTPS.
    # Inline scripts are allowed because network snippets are often inline.
    # Strict alternative while provider is 'none':
    #   script-src 'self'; frame-src 'none'; img-src 'self' data:; connect-src 'self'
    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; frame-src https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ---- health check for Docker / Coolify ----
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- HTML: always revalidate so game updates reach players immediately ----
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # ---- JS / CSS: short cache + revalidate (files are not fingerprinted) ----
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # ---- images / fonts: long cache ----
    location ~* \.(?:png|jpe?g|gif|webp|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # ---- ads.txt: must be reachable at the root of the domain ----
    location = /ads.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        access_log off;
    }

    # ---- routes: /games/snake → /games/snake/index.html ----
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # never serve dotfiles
    location ~ /\. { deny all; return 404; }
}
