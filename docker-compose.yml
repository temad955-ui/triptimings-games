# Used by Coolify ("Docker Compose" build pack) or locally: docker compose up -d --build
services:
  games:
    build:
      context: .
      dockerfile: Dockerfile
    image: triptimings-games:latest
    restart: unless-stopped
    ports:
      - "8080:8080"   # Coolify: remove this line and set the domain on the service instead
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
